# ===================================================================
# Mental Math Game – Spring Boot Configuration
# ===================================================================

# Server Port: Default to 8081 because 8080 is reserved by Oracle TNSLSNR on this machine.
# Cloud platforms (Render, Railway, etc.) override this dynamically with their own $PORT.
server.port=${PORT:8081}
spring.application.name=mental-math-game-api

# MySQL Database Configuration via Environment Variables with Safe Defaults
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mental_math_game?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Secure Error Handling: Do not leak Java stacktraces to HTTP clients
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
